server:
  port: 80
  baseURL: "/"
  database: "/home/filebrowser/data/db/database.db"
  cacheDir: "/home/filebrowser/tmp"
  logging:
    - levels: "info|warning|error"
  sources:
    - path: "/srv"
      name: "D"
      config:
        defaultEnabled: true
        rules:
          - folderName: "$RECYCLE.BIN"
          - folderName: "System Volume Information"
auth:
  tokenExpirationHours: 24
  methods:
    password:
      enabled: true
      minLength: 8
      signup: false
  adminUsername: "admin"
frontend:
  name: "DH Files"
